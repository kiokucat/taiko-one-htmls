// ==================== アセット定義 ====================
const ASSET_BASE = 'assets/';
// 空フレーム(サイズ2108の空PNG)を除外したフレーム番号リスト
// キャラクター構成(b1/b2廃止):
//   char  = n.png(通常・両腕下降)
//   gogo  = gogo_now_frame_1〜5 (1>2>3>4>5>4>3>2ループ)
//   clear = n.png(リザルトでも通常ポーズ)
//   10コンボごとの演出は combo.png(別途読み込み)
const FRAME_SETS = {
  char:  ['n.png'],
  gogo:  [1, 2, 3, 4, 5].map(i => `gogo_now_frame_${i}.png`),
  clear: ['n.png'],
  soul:  [...Array(8).keys()].map(i => `soul_new_${i}.png`),
  fire:  [...Array(8).keys()].map(i => `firework_new_${i}.png`),
};

const PLAYER_NAME = 'kiokucat';

// 開始前カウントイン(秒): 音楽開始と音符開始位置を同だけ遅らせる
const LEAD_IN = 2.0;

// コンボボイスを鳴らすコンボ数
const COMBO_VOICE_THRESHOLDS = [10, 30, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];

// ==================== TJAパーサー ====================
class TJAParser {
  parse(tjaText) {
    const lines = tjaText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    const global = {};
    const courses = [];
    let currentCourse = null;
    let inStart = false;
    let currentMeasure = null;

    const pushCourse = () => {
      if (currentCourse && currentCourse.measures.length > 0) {
        courses.push(currentCourse);
      }
    };

    const resetMeasure = (bpm) => {
      return {
        notes: '',
        bpm: bpm || currentCourse.currentBPM || parseFloat(global.BPM) || 120,
        scroll: currentCourse ? currentCourse.currentScroll : 1,
        measure: currentCourse ? [...currentCourse.currentMeasure] : [4, 4],
        gogo: currentCourse ? currentCourse.gogo : false,
        barline: true
      };
    };

    for (let rawLine of lines) {
      let line = rawLine.split('//')[0].trim();
      if (!line) continue;

      if (!inStart) {
        if (line === '#START') {
          inStart = true;
          if (!currentCourse) {
            currentCourse = {
              headers: { COURSE: 'Oni', LEVEL: '1' },
              measures: [],
              balloons: [],
              currentBPM: parseFloat(global.BPM) || 120,
              currentScroll: 1,
              currentMeasure: [4, 4],
              gogo: false
            };
          }
          currentMeasure = resetMeasure();
        } else if (line.includes(':')) {
          const [key, ...vals] = line.split(':');
          const k = key.trim();
          const v = vals.join(':').trim();

          if (k === 'COURSE') {
            pushCourse();
            currentCourse = {
              headers: { COURSE: v, LEVEL: '1' },
              measures: [],
              balloons: [],
              currentBPM: parseFloat(global.BPM) || 120,
              currentScroll: 1,
              currentMeasure: [4, 4],
              gogo: false
            };
          } else if (currentCourse) {
            currentCourse.headers[k] = v;
            if (k === 'BPM') currentCourse.currentBPM = parseFloat(v);
            if (k === 'BALLOON') currentCourse.balloons = v.split(/,\s*/).map(Number);
          } else {
            global[k] = v;
            if (k === 'BPM') global.BPM = v;
          }
        }
      } else {
        if (line === '#END') {
          if (currentMeasure && currentMeasure.notes) {
            currentCourse.measures.push({...currentMeasure});
          }
          inStart = false;
        } else if (line.startsWith('#')) {
          const parts = line.split(/\s+/);
          let cmd = parts[0];
          const arg = parts.slice(1).join(' ');

          // コマンド名の正規化: 大文字化 + '#SCROLL2'のような数字密着形式に対応
          cmd = cmd.toUpperCase();
          let inlineVal = null;
          const mCmd = cmd.match(/^(#SCROLL|#BMSCROLL|#HBSCROLL|#BPMCHANGE)([-\d.]+)$/);
          if (mCmd) { cmd = mCmd[1]; inlineVal = mCmd[2]; }
          const val = inlineVal !== null ? inlineVal : arg;
          if (cmd === '#BRANCHSTART' || cmd === '#N' || cmd === '#E' || cmd === '#M' || cmd === '#LEVELHOLD') {
            continue;
          }
          if (cmd === '#BARLINEOFF') currentMeasure.barline = false;
          if (cmd === '#BARLINEON') currentMeasure.barline = true;
          if (cmd === '#GOGOSTART') currentCourse.gogo = currentMeasure.gogo = true;
          if (cmd === '#GOGOEND') currentCourse.gogo = currentMeasure.gogo = false;
          if (cmd === '#MEASURE') {
            const m = arg.split('/').map(Number);
            if (m.length === 2) {
              currentCourse.currentMeasure = m;
              currentMeasure.measure = m;
            }
          }
          // #BMSCROLL / #HBSCROLL も簡易的にスクロール速度として扱う
          if (cmd === '#SCROLL' || cmd === '#BMSCROLL' || cmd === '#HBSCROLL') {
            currentCourse.currentScroll = parseFloat(val) || 1;
            currentMeasure.scroll = currentCourse.currentScroll;
          }
          if (cmd === '#BPMCHANGE') {
            if (currentMeasure.notes) {
              currentCourse.measures.push({...currentMeasure});
            }
            const newBpm = parseFloat(val);
            currentCourse.currentBPM = newBpm;
            currentMeasure = resetMeasure(newBpm);
          }
          if (cmd === '#DELAY') {
            if (currentMeasure.notes) {
              currentCourse.measures.push({...currentMeasure});
            }
            const delaySec = parseFloat(arg) || 0;
            currentCourse.measures.push({
              notes: '', bpm: currentCourse.currentBPM,
              scroll: currentCourse.currentScroll,
              measure: [...currentCourse.currentMeasure],
              gogo: currentCourse.gogo, barline: false, delay: delaySec
            });
            currentMeasure = resetMeasure();
          }
        } else {
          if (line.endsWith(',')) {
            currentMeasure.notes += line.slice(0, -1);
            currentCourse.measures.push({...currentMeasure});
            currentMeasure = resetMeasure();
          } else {
            currentMeasure.notes += line;
          }
        }
      }
    }
    pushCourse();

    for (let c of courses) {
      for (let k in global) {
        if (!c.headers[k]) c.headers[k] = global[k];
      }
    }
    return courses;
  }
}

// ==================== オーディオマネージャー ====================
class AudioManager {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.musicSource = null;
    this.musicBuffer = null;
    this.startTime = 0;
    this.pausedAt = 0;
    this.isPlaying = false;
    this.seGain = null;
    this._init();
  }

  _init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.6;
      this.masterGain.connect(this.ctx.destination);
      this.seGain = this.ctx.createGain();
      this.seGain.gain.value = 0.5;
      this.seGain.connect(this.masterGain);
    } catch(e) {
      console.error('AudioContext init failed:', e);
    }
  }

  _ensureContext() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  async loadFromFile(file) {
    this._ensureContext();
    if (!this.ctx) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      this.musicBuffer = await this.ctx.decodeAudioData(arrayBuffer);
    } catch(e) {
      console.error('Audio decode failed:', e);
      throw e;
    }
  }

  loadFromBuffer(buffer) {
    this._ensureContext();
    this.musicBuffer = buffer;
  }

  play() {
    this._ensureContext();
    if (!this.musicBuffer || !this.ctx) return;
    if (this.isPlaying) this.stop();
    this.musicSource = this.ctx.createBufferSource();
    this.musicSource.buffer = this.musicBuffer;
    this.musicSource.connect(this.masterGain);
    this.startTime = this.ctx.currentTime - this.pausedAt;
    this.musicSource.start(0, this.pausedAt);
    this.isPlaying = true;
  }

  stop() {
    if (this.musicSource) {
      try { this.musicSource.stop(); } catch(e){}
      this.musicSource = null;
    }
    this.isPlaying = false;
    this.pausedAt = 0;
  }

  getTime() {
    if (!this.isPlaying) return this.pausedAt;
    return this.ctx.currentTime - this.startTime;
  }

  // assetsのdon/ka.ogg等を読み込み(無ければnull→合成音フォールバック)
  // manifestがある場合は列挙されたファイルのみ読み込み(404スパムを防ぐ)
  async loadSE(manifest) {
    if (!this.ctx) return;
    const loadOne = async (file) => {
      try {
        const r = await fetch(ASSET_BASE + file);
        if (!r.ok) return null;
        return await this.ctx.decodeAudioData(await r.arrayBuffer());
      } catch (e) { return null; }
    };
    const tryLoad = async (name) => {
      for (const ext of ['ogg', 'mp3', 'wav']) {
        const b = await loadOne(`${name}.${ext}`);
        if (b) return b;
      }
      return null;
    };
    const seMap = manifest && manifest.se;
    this.seBuffers = {
      don: seMap && seMap.don ? await loadOne(seMap.don) : await tryLoad('don'),
      ka:  seMap && seMap.ka  ? await loadOne(seMap.ka)  : await tryLoad('ka'),
    };
    // 結果音声: ノルマ/フルコンボ/ドンダフル/失敗
    const rMap = (manifest && manifest.result) || {};
    this.resultVoices = {
      clear: rMap.clear ? await loadOne(rMap.clear) : await tryLoad('norma'),
      fc:    rMap.fc    ? await loadOne(rMap.fc)    : await tryLoad('fullcombo'),
      dfc:   rMap.dfc   ? await loadOne(rMap.dfc)   : await tryLoad('dondafull'),
      fail:  rMap.fail  ? await loadOne(rMap.fail)  : await tryLoad('failed'),
    };
    // コンボボイス: 10,30,50,100,200,...1000
    this.comboVoices = {};
    const vMap = manifest && manifest.voices;
    for (const n of COMBO_VOICE_THRESHOLDS) {
      this.comboVoices[n] = (vMap && vMap[n]) ? await loadOne(vMap[n])
                          : await tryLoad('combo_' + n) || await tryLoad('voice_' + n);
    }
  }

  // コンボボイス再生(無ければ何もしない)
  playComboVoice(combo) {
    if (!this.ctx) return;
    const buf = this.comboVoices && this.comboVoices[combo];
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.seGain);
    src.start();
  }

  playSE(type) {
    this._ensureContext();
    if (!this.ctx) return;
    // assetsの音源があればそちらを使う
    const buf = this.seBuffers && this.seBuffers[type];
    if (buf) {
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.seGain);
      src.start();
      return;
    }
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.seGain);
    const now = this.ctx.currentTime;
    if (type === 'don') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'ka') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    }
  }

  async generateDemoMusic() {
    if (!this.ctx) this._init();
    const sampleRate = this.ctx.sampleRate;
    const bpm = 130;
    const beatSec = 60 / bpm;
    const duration = beatSec * 90;
    const length = sampleRate * duration;
    const buffer = this.ctx.createBuffer(2, length, sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        const beat = t / beatSec;
        let sample = 0;
        if (beat % 1 < 0.1) {
          const kt = (beat % 1) / 0.1;
          sample += Math.sin(2 * Math.PI * 60 * t) * (1 - kt) * 0.8;
          sample += (Math.random() * 2 - 1) * (1 - kt) * 0.3;
        }
        if ((beat + 0.5) % 2 < 0.1) {
          const st = ((beat + 0.5) % 2) / 0.1;
          sample += (Math.random() * 2 - 1) * (1 - st) * 0.6;
        }
        if (beat % 0.5 < 0.05) {
          const ht = (beat % 0.5) / 0.05;
          sample += (Math.random() * 2 - 1) * (1 - ht) * 0.15;
        }
        const bassNote = [55, 55, 73, 73, 65, 65, 49, 49][Math.floor(beat / 4) % 8];
        sample += Math.sin(2 * Math.PI * bassNote * t) * 0.15 * Math.exp(-((beat % 1) * 4));
        if (beat >= 32 && beat < 80) {
          const melNotes = [440, 523, 659, 784, 659, 523, 440, 392];
          const noteIdx = Math.floor((beat - 32) / 0.5) % melNotes.length;
          const freq = melNotes[noteIdx];
          sample += Math.sin(2 * Math.PI * freq * t) * 0.08 * Math.sin(Math.PI * ((beat - 32) % 0.5) / 0.5);
        }
        data[i] = sample * 0.7;
      }
    }
    this.musicBuffer = buffer;
  }
}

// ==================== ファイルローダー ====================
class SongLoader {
  constructor() {
    this.parser = new TJAParser();
  }

  // TJA読込: UTF-8でデコードし、文字化け(�)があればShift-JISで再デコード
  async readTJA(file) {
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) {
      try { text = new TextDecoder('shift_jis').decode(buf); } catch (e) {}
    }
    return text;
  }

  async handleFiles(files) {
    const folderMap = {};
    for (let file of files) {
      const path = file.webkitRelativePath || file.name;
      const parts = path.split('/');
      if (parts.length < 1) continue;
      const fileName = parts[parts.length - 1].toLowerCase();
      // フォルダ構造の解釈:
      //   親/曲フォルダ/*.tja        → parts.slice(1,-1).join('/') が曲フォルダ
      //   曲フォルダ自体を選択した    → parts[0] が曲フォルダ
      //   ファイルだけドロップした    → ファイル名(拡張子抜き)を曲名にする
      let songFolder;
      if (parts.length >= 3) {
        songFolder = parts.slice(1, -1).join('/');
      } else if (parts.length === 2) {
        songFolder = parts[0];
      } else {
        songFolder = file.name.replace(/\.[^.]+$/, '') || '曲';
      }
      if (!folderMap[songFolder]) {
        folderMap[songFolder] = { tja: null, audio: null };
      }
      if (fileName.endsWith('.tja')) {
        folderMap[songFolder].tja = file;
      }
      if (fileName.endsWith('.ogg') || fileName.endsWith('.mp3') || fileName.endsWith('.wav')) {
        folderMap[songFolder].audio = file;
      }
    }
    const loaded = [];
    for (let songName in folderMap) {
      const entry = folderMap[songName];
      if (entry.tja && entry.audio) {
        try {
          const tjaText = await this.readTJA(entry.tja);
          const courses = this.parser.parse(tjaText);
          if (courses.length > 0) {
            loaded.push({
              name: songName,
              courses,
              audioFile: entry.audio,
              genre: (courses[0].headers.GENRE || '').trim() || 'その他'
            });
          }
        } catch(e) {
          console.error('Parse error:', songName, e);
        }
      }
    }
    return loaded;
  }
}

class GameEngine {
  constructor(canvas, audio) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.audio = audio;
    this.assets = { char: [], gogo: [], clear: [], soul: [], fire: [] };
    this.notes = [];
    this.rolls = [];
    this.balloons = [];
    this.measureLines = [];
    this.gogoRanges = [];
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.perfect = 0;
    this.good = 0;
    this.miss = 0;
    this.soul = 0;
    this.isPlaying = false;
    this.judgeLineX = 420;
    this.noteSpeed = 380;
    this.hs = 1.0; // ハイスピード倍率(キーで変更)
    this.hitEffects = [];
    this.screen = 'title';
    this.songs = [];
    this.selectedSong = 0;
    this.selectedDiff = 0;
    this.scrollOffset = 0;
    this.titleAnim = 0;
    this.animTime = 0;
    this.charHitT = 0;
    this.lastFrame = performance.now();
    this.diffScrollX = 0;
    this.autoPlay = false;
    this.autoProcessed = new Set();
    this.gogoActive = false;
    // キャラクターのキー色(b1=胴体 / b2=顔)
    this.bodyColor = '#e53935';
    this.faceColor = '#fff3e0';
    this.composite = { char: [], gogo: [], clear: [] };
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.loop();
  }

  resize() {
    const container = this.canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const availW = container.clientWidth * 0.96;
    const availH = container.clientHeight * 0.84;
    let cssW = availW;
    let cssH = cssW / (W / H);
    if (cssH > availH) {
      cssH = availH;
      cssW = cssH * (W / H);
    }
    this.canvas.style.width = Math.round(cssW) + 'px';
    this.canvas.style.height = Math.round(cssH) + 'px';
    this.canvas.width = Math.max(1, Math.round(cssW * dpr));
    this.canvas.height = Math.max(1, Math.round(cssH * dpr));
    this.scale = this.canvas.width / W;
  }

  async loadAssets(onProgress) {
    this.assetIdx = {};
    // manifest.jsonがあれば任意のファイル名/枚数に対応(無ければデフォルト名で試行)
    let manifest = null;
    try {
      const r = await fetch(ASSET_BASE + 'manifest.json');
      if (r.ok) manifest = await r.json();
    } catch (e) { /* file://等では不可 */ }
    const filesOf = (key, defaults) => {
      if (manifest && Array.isArray(manifest[key])) return manifest[key];
      return defaults;
    };
    const jobs = [];
    let done = 0;
    const total = Object.values(FRAME_SETS).reduce((s, a) => s + a.length, 0);
    for (let key of Object.keys(FRAME_SETS)) {
      const fileList = filesOf(key, FRAME_SETS[key]);
      this.assets[key] = fileList.map(name => {
        const img = new Image();
        img.src = ASSET_BASE + name;
        jobs.push(new Promise(res => {
          img.onload = img.onerror = () => { done++; onProgress(done / total); res(); };
        }));
        return img;
      });
      // 除外済みフレームリストに対応する元フレーム番号(b1/b2との整合用)
      this.assetIdx[key] = fileList.map(name => {
        const m = name.match(/_(\d+)\.png$/);
        return m ? parseInt(m[1], 10) : 0;
      });
    }
    // 15秒で打ち切り: アセットが無くてもゲームは開始できる
    await Promise.race([Promise.all(jobs), new Promise(res => setTimeout(res, 15000))]);
    this.manifest = manifest; // SEロードに引き継ぐ
    // 10コンボ演出用combo.png(単体アセット)
    this.comboImg = new Image();
    this.comboImg.src = ASSET_BASE + (manifest && manifest.combo ? manifest.combo : 'combo.png');
    // 難易度徽章(easy/normal/hard/oni/edit)
    this.courseBadges = {};
    const badgeMap = (manifest && manifest.badges) || { Easy:'easy.png', Normal:'normal.png', Hard:'hard.png', Oni:'oni.png', Edit:'edit.png' };
    for (const [course, file] of Object.entries(badgeMap)) {
      const im = new Image();
      im.src = ASSET_BASE + file;
      this.courseBadges[course] = im;
    }
    // ミニ太鼓(入力表示): 枠 + 左右×don/ka のハイライト
    this.tkImages = {};
    const tkMap = (manifest && manifest.tk) || { frame:'tk_frame.png', left_don:'tk_left_don.png', left_ka:'tk_left_ka.png', right_don:'tk_right_don.png', right_ka:'tk_right_ka.png' };
    for (const [n, file] of Object.entries(tkMap)) {
      const im = new Image();
      im.src = ASSET_BASE + file;
      this.tkImages[n] = im;
    }
    this.buildComposites();
  }

  // b1/b2廃止: 合成(キー色塗替)は不要。フレーム画像をそのまま使う
  buildComposites() {
    this.composite = {
      char: (this.assets.char || []).filter(img => img.complete && img.naturalWidth),
      gogo: (this.assets.gogo || []).filter(img => img.complete && img.naturalWidth),
      clear: (this.assets.clear || []).filter(img => img.complete && img.naturalWidth),
    };
  }

  // キャラクターアニメーションフレーム取得
  // char(通常): 常にノーマル(0枚目)。10コンボごとの演出はcombo.png(0.5秒)で行う
  // gogo(GOGO): 1>2>3>4>5>4>3>2 をループ
  charFrame(mode) {
    const bank = (this.composite[mode] && this.composite[mode].length) ? this.composite[mode]
               : (this.assets[mode] && this.assets[mode].length) ? this.assets[mode] : this.assets.char;
    if (!bank || !bank.length) return null;
    if (mode === 'gogo') {
      // フレーム番号(1〜5) → バンクindex(0〜4) に変換して 1>2>3>4>5>4>3>2 をループ
      const seq = [1, 2, 3, 4, 5, 4, 3, 2];
      const step = Math.floor(this.animTime * 8) % seq.length;
      return bank[Math.min(seq[step] - 1, bank.length - 1)];
    }
    return bank[0];
  }

  drawCharImg(ctx, cx, cy, w, h, mode, squash) {
    // 10コンボ到達時はcombo.pngを0.5秒表示する
    if (mode === 'char' && this.comboImg && this.comboImg.complete && this.comboImg.naturalWidth
        && this.comboFlashAt !== undefined && (this.animTime - this.comboFlashAt) < 0.5) {
      ctx.save();
      ctx.translate(cx, cy);
      if (squash > 0) {
        const s = 1 - 0.16 * Math.sin((squash / 0.25) * Math.PI);
        ctx.scale(1 + (1 - s) * 0.8, s);
      }
      const iw = this.comboImg.naturalWidth, ih = this.comboImg.naturalHeight;
      const sc = Math.min(w / iw, h / ih);
      ctx.drawImage(this.comboImg, -iw * sc / 2, -ih * sc / 2, iw * sc, ih * sc);
      ctx.restore();
      return;
    }
    const img = this.charFrame(mode);
    ctx.save();
    ctx.translate(cx, cy);
    if (squash > 0) {
      const s = 1 - 0.16 * Math.sin((squash / 0.25) * Math.PI);
      ctx.scale(1 + (1 - s) * 0.8, s);
    }
    // canvas合成フレームでもHTMLImageElementでも正しく判定
    const drawable = img && ((img instanceof HTMLCanvasElement && img.width > 0)
                           || (img.complete && img.naturalWidth));
    if (drawable) {
      // アスペクト比を保ってw×hに収める(n.png等の任意サイズに対応)
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const sc = Math.min(w / iw, h / ih);
      ctx.drawImage(img, -iw * sc / 2, -ih * sc / 2, iw * sc, ih * sc);
    } else {
      // フォールバック: 手書きドンちゃん
      ctx.fillStyle = '#e53935';
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.42, h * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0, h * 0.05, w * 0.3, h * 0.28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-w * 0.1, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w * 0.1, 0, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  loadCourse(course) {
    this.course = course;
    this.notes = [];
    this.rolls = [];
    this.balloons = [];
    this.measureLines = [];
    this.gogoRanges = [];
    this.autoProcessed.clear();

    let time = (parseFloat(course.headers.OFFSET) || 0) * -1;
    if (time < 0) time = 0;
    // 音符タイミングは音楽位置と一致(カウントイン中の先行スクロールはgameClock()の負時刻で実現)
    const baseBPM = parseFloat(course.headers.BPM) || 120;
    let currentBPM = baseBPM;
    let currentScroll = 1;
    let gogoStart = null;

    const rawNotes = [];

    for (let m = 0; m < course.measures.length; m++) {
      const measure = course.measures[m];

      if (measure.delay) {
        time += measure.delay;
        continue;
      }

      if (measure.bpm) currentBPM = measure.bpm;
      if (measure.scroll !== undefined) currentScroll = measure.scroll;

      const beats = measure.measure[0] / measure.measure[1] * 4;
      const measureTime = (60 / currentBPM) * beats;

      if (measure.barline !== false) {
        this.measureLines.push({ time: time, scroll: currentScroll });
      }

      // GOGO区間の記録
      if (measure.gogo && gogoStart === null) gogoStart = time;
      if (!measure.gogo && gogoStart !== null) {
        this.gogoRanges.push([gogoStart, time]);
        gogoStart = null;
      }

      const notesStr = measure.notes;
      if (notesStr) {
        const noteCount = notesStr.length;
        for (let i = 0; i < noteCount; i++) {
          const type = parseInt(notesStr[i]);
          const noteTime = time + measureTime * (i / noteCount);
          if (isNaN(noteTime)) continue; // 異常な譜面データはスキップ
          rawNotes.push({ type, time: noteTime, scroll: currentScroll });
        }
      }

      time += measureTime;
    }
    if (gogoStart !== null) this.gogoRanges.push([gogoStart, time]);

    const used = new Array(rawNotes.length).fill(false);
    let balloonIdx = 0;

    for (let i = 0; i < rawNotes.length; i++) {
      if (used[i]) continue;
      const t = rawNotes[i].type;

      if (t === 5 || t === 6 || t === 7) {
        let endIdx = -1;
        for (let j = i + 1; j < rawNotes.length; j++) {
          if (rawNotes[j].type === 8) { endIdx = j; break; }
        }
        if (endIdx === -1) endIdx = rawNotes.length - 1;

        const startTime = rawNotes[i].time;
        const endTime = rawNotes[endIdx].time;
        const scroll = rawNotes[i].scroll;

        const innerNormalNotes = [];
        for (let k = i + 1; k < endIdx; k++) {
          const innerType = rawNotes[k].type;
          if (innerType >= 1 && innerType <= 4) {
            innerNormalNotes.push({ type: innerType, time: rawNotes[k].time, scroll: rawNotes[k].scroll, hit: false });
            used[k] = true;
          }
        }
        this.notes.push(...innerNormalNotes);
        used[i] = true;
        used[endIdx] = true;

        if (t === 5 || t === 6) {
          // 連打の途中に通常ノーツ(1-4)がある場合、その音符の位置で連打を終了する
          let rollEnd = endTime;
          for (const n of innerNormalNotes) {
            if (n.time > startTime + 0.01 && n.time < rollEnd) rollEnd = n.time;
          }
          this.rolls.push({
            type: t === 5 ? 'roll' : 'big_roll',
            startTime, endTime: rollEnd, scroll,
            hit: false, hits: 0
          });
        } else if (t === 7) {
          this.balloons.push({
            time: startTime, endTime,
            type: 'balloon', scroll,
            hitsRequired: course.balloons[balloonIdx] || 5,
            hits: 0, hit: false, popped: false, missed: false
          });
          balloonIdx++;
        }
      }
    }

    for (let i = 0; i < rawNotes.length; i++) {
      if (used[i]) continue;
      const n = rawNotes[i];
      if (n.type === 0 || n.type === 8 || n.type === 9) continue; // 9(特殊)は無視
      this.notes.push({ type: n.type, time: n.time, scroll: n.scroll, hit: false });
    }

    this.totalNotes = this.notes.length + this.rolls.length + this.balloons.length;
    // 終了時刻(空配列でも安全)
    const endTimes = [...this.notes.map(n => n.time), ...this.rolls.map(r => r.endTime), ...this.balloons.map(b => b.endTime)];
    this.songEndTime = endTimes.length ? Math.max(...endTimes) : 0;

    // スコア設計: フルコンボ・全良で約100万点(天井999,999)
    const tn = Math.max(1, this.totalNotes);
    this.pointPerfect = 650000 / tn;
    this.pointGood = this.pointPerfect / 2;
    this.comboK = 700000 / (tn * (tn + 1)); // コンボボーナス合計≈35万
  }

  async startGame() {
    const song = this.songs[this.selectedSong];
    if (!song) return;

    if (song.isBuiltIn && song.audioBuffer) {
      this.audio.loadFromBuffer(song.audioBuffer);
    } else if (song.audioFile) {
      try {
        await this.audio.loadFromFile(song.audioFile);
      } catch(e) {
        console.error('Failed to load audio:', e);
        alert('音楽ファイルの読み込みに失敗しました。ファイル形式を確認してください。');
        return;
      }
    }

    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.perfect = 0;
    this.good = 0;
    this.miss = 0;
    this.soul = 0;
    this.hitEffects = [];
    this.autoProcessed.clear();
    this._endTriggered = false;
    this._autoAlt = false;
    this._autoRollLast = undefined;
    this._autoBalloonLast = undefined;
    this.isPlaying = true;
    this.screen = 'playing';
    this.gameStartAt = performance.now();
    // カウントイン後に音楽開始(音符はすでにスクロール済み)
    this._startTimer = setTimeout(() => {
      this._startTimer = null;
      if (this.isPlaying) this.audio.play();
    }, LEAD_IN * 1000);
  }

  stopGame() {
    this.isPlaying = false;
    if (this._startTimer) {
      clearTimeout(this._startTimer);
      this._startTimer = null;
    }
    this.audio.stop();
  }

  // 演奏クロック: カウントイン中は-LEAD_INから進行(音符が先行して流れる)。
  // 音楽開始直前で0になり、開始後はaudio.getTime()と連続する
  gameClock() {
    if (this._endTriggered && this.frozenClock !== undefined) return this.frozenClock;
    if (this.isPlaying && !this.audio.isPlaying && this.gameStartAt) {
      return (performance.now() - this.gameStartAt) / 1000 - LEAD_IN;
    }
    return this.audio.getTime();
  }

  isGogo(t) {
    for (let r of this.gogoRanges) {
      if (t >= r[0] && t < r[1]) return true;
    }
    return false;
  }

  // 現在のGOGO区間の開始時刻(区間内でなければnull)
  gogoStartAt(t) {
    for (let r of this.gogoRanges) {
      if (t >= r[0] && t < r[1]) return r[0];
    }
    return null;
  }

  loop() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - this.lastFrame) / 1000);
    this.lastFrame = now;
    this.animTime = now / 1000;
    this.titleAnim += dt;
    this.ctx.setTransform(this.scale, 0, 0, this.scale, 0, 0);
    if (this.charHitT > 0) this.charHitT = Math.max(0, this.charHitT - dt);

    if (this.screen === 'playing') {
      const musicTime = this.gameClock();
      this.update(musicTime);
      this.drawGame(musicTime);
      if (this._endTriggered) this.drawClear(); // 演奏画面の上にクリア演出
    } else if (this.screen === 'title') {
      this.drawTitle();
    } else if (this.screen === 'songSelect') {
      this.drawSongSelect();
    } else if (this.screen === 'difficulty') {
      this.drawDifficulty();
    } else if (this.screen === 'result') {
      this.drawResult();
    }
    // 検索ボックスは曲選択画面でのみ表示
    const sb = document.getElementById('searchBox');
    if (sb && sb.style.display !== (this.screen === 'songSelect' ? 'block' : 'none')) {
      sb.style.display = this.screen === 'songSelect' ? 'block' : 'none';
    }
    requestAnimationFrame(() => this.loop());
  }

  update(musicTime) {
    if (this.autoPlay) this._processAuto(musicTime);
    this.gogoActive = this.isGogo(musicTime);

    for (let note of this.notes) {
      if (!note.hit) {
        note.x = this.judgeLineX + (note.time - musicTime) * this.noteSpeed * this.hs * note.scroll;
      }
    }
    for (let roll of this.rolls) {
      if (!roll.hit) {
        roll.startX = this.judgeLineX + (roll.startTime - musicTime) * this.noteSpeed * this.hs * roll.scroll;
        roll.endX = this.judgeLineX + (roll.endTime - musicTime) * this.noteSpeed * this.hs * roll.scroll;
      }
    }
    for (let balloon of this.balloons) {
      if (!balloon.popped) {
        const rawX = this.judgeLineX + (balloon.time - musicTime) * this.noteSpeed * this.hs * balloon.scroll;
        balloon.x = Math.max(rawX, this.judgeLineX); // 判定枠に到達したらそれ以上左へ行かず止まる
      }
    }

    for (let note of this.notes) {
      if (!note.hit && note.type >= 1 && note.type <= 4 && musicTime > note.time + 0.15) {
        note.hit = true;
        this.combo = 0;
        this.miss++;
        this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'miss', time: musicTime, life: 0.5 });
      }
    }

    for (let roll of this.rolls) {
      if (!roll.hit && musicTime > roll.endTime + 0.2) {
        roll.hit = true;
        if (roll.hits === 0) {
          this.combo = 0;
          this.miss++;
          this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'miss', time: musicTime, life: 0.5 });
        } else {
          this.perfect++;
          this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'perfect', time: musicTime, life: 0.6 });
        }
      }
    }

    for (let balloon of this.balloons) {
      if (!balloon.popped && !balloon.missed) {
        if (balloon.hit && musicTime > balloon.endTime) {
          balloon.popped = true;
          if (balloon.hits >= balloon.hitsRequired) balloon.poppedAt = musicTime;
          if (balloon.hits >= balloon.hitsRequired) {
            this.perfect++;
            this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'perfect', time: musicTime, life: 0.6 });
          } else {
            balloon.missed = true;
            this.combo = 0;
            this.miss++;
            this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'miss', time: musicTime, life: 0.5 });
          }
        } else if (!balloon.hit && musicTime > balloon.time + 0.15) {
          // スルーした場合: 不可判定にもコンボリセットにもしない
          balloon.hit = true;
          balloon.popped = true;
          balloon.missed = true;
        }
      }
    }

    // 魂ゲージ更新
    const denom = Math.max(1, this.totalNotes * 2);
    this.soul = Math.max(0, Math.min(1, ((this.perfect * 2 + this.good - this.miss * 2) * 2.8) / denom));

    this.hitEffects = this.hitEffects.filter(e => musicTime - e.time < e.life);

    const allNotesDone = this.notes.every(n => n.hit) &&
                         this.rolls.every(r => r.hit) &&
                         this.balloons.every(b => b.popped);
    // 終了検出: 最後のノーツ+2秒後(全処理済み or +8秒で強制)。成績発表前にクリア演出へ
    if (!this._endTriggered && this.totalNotes > 0 && musicTime > this.songEndTime + 2) {
      if (allNotesDone || musicTime > this.songEndTime + 8) {
        this._endTriggered = true;
        this.showClearScreen();
      }
    }
  }

  // 演奏終了演出: ノルマ/フルコンボ/ドンダフル/失敗を中央に表示し音声を鳴らす
  showClearScreen() {
    const isDFC = this.miss === 0 && this.good === 0 && this.perfect > 0;
    const isFC = this.miss === 0 && !isDFC && (this.perfect + this.good) > 0;
    const cleared = this.soul >= 0.8 || isFC;
    let kind;
    if (isDFC) kind = 'dfc';
    else if (isFC) kind = 'fc';
    else if (cleared) kind = 'clear';
    else kind = 'fail';
    this.clearKind = kind;
    this.clearShownAt = this.animTime;
    this.frozenClock = this.gameClock();
    this.isPlaying = false;
    this.audio.stop();
    // 結果音声(norma/fullcombo/dondafull/failed.ogg)
    const v = this.audio.resultVoices || {};
    const buf = kind === 'dfc' ? v.dfc : kind === 'fc' ? v.fc : kind === 'clear' ? v.clear : v.fail;
    if (buf && this.audio.ctx) {
      const src = this.audio.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.audio.masterGain);
      src.start();
    }
  }

  // クリア演出描画(なめらかなスケールアニメーション)
  drawClear() {
    const ctx = this.ctx;
    const t = this.animTime - this.clearShownAt;
    const ease = Math.min(1, t / 0.4);
    const scale = 0.6 + 0.4 * (1 - Math.pow(1 - ease, 3)); // ease-out
    const alpha = t > 2.2 ? Math.max(0, 1 - (t - 2.2) / 0.4) : 1;
    const label = { dfc: 'ドンダフルコンボ!!', fc: 'フルコンボ!!', clear: 'クリア成功', fail: 'クリア失敗' }[this.clearKind];
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.font = 'bold 72px "Hiragino Kaku Gothic ProN", sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#fff';
    ctx.strokeText(label, 0, 0);
    let fill;
    if (this.clearKind === 'dfc') {
      // ニジイロ: 虹色グラデーション(色相が流れる)
      const hue = (this.animTime * 60) % 360;
      fill = ctx.createLinearGradient(-330, 0, 330, 0);
      for (let i = 0; i <= 6; i++) fill.addColorStop(i / 6, `hsl(${(hue + i * 60) % 360}, 92%, 55%)`);
    } else if (this.clearKind === 'fc') {
      fill = ctx.createLinearGradient(0, -50, 0, 20);
      fill.addColorStop(0, '#ffd700');
      fill.addColorStop(1, '#ff8f00');
    } else if (this.clearKind === 'clear') {
      fill = '#e53935'; // 赤
    } else {
      fill = '#2196f3'; // 青
    }
    ctx.fillStyle = fill;
    ctx.fillText(label, 0, 0);
    ctx.restore();
    if (t > 2.6) this.screen = 'result'; // 成績発表へ
  }

  _processAuto(musicTime) {
    for (let note of this.notes) {
      if (note.hit) continue;
      const key = 'n' + note.time;
      if (this.autoProcessed.has(key)) continue;
      if (musicTime >= note.time - 0.02) {
        this.autoProcessed.add(key);
        this.input((note.type === 1 || note.type === 3));
      }
    }
    // 連打: 秒速15・交互打ち
    for (let roll of this.rolls) {
      if (roll.hit) continue;
      if (musicTime >= roll.startTime - 0.02 && musicTime <= roll.endTime) {
        if (this._autoRollLast === undefined || musicTime - this._autoRollLast >= 1 / 15) {
          this._autoRollLast = musicTime;
          this._autoAlt = !this._autoAlt;
          this.input(this._autoAlt);
        }
      }
    }
    // 風船: 秒速30・交互打ち
    for (let balloon of this.balloons) {
      if (balloon.popped) continue;
      if (musicTime >= balloon.time - 0.02 && musicTime <= balloon.endTime) {
        if (this._autoBalloonLast === undefined || musicTime - this._autoBalloonLast >= 1 / 30) {
          this._autoBalloonLast = musicTime;
          this._autoAlt = !this._autoAlt;
          this.input(this._autoAlt);
        }
      }
    }
  }

  // ==================== 描画: ゲーム画面 ====================
  drawGame(musicTime) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    this.drawHeader(ctx);
    this.drawLane(ctx, musicTime);
    // 花火はGOGO開始から2秒間のみ
    const gs = this.gogoStartAt(musicTime);
    this.drawFestival(ctx, this.animTime, this.gogoActive, (gs !== null && musicTime - gs < 2.0) ? (musicTime - gs) : null);
    this.drawBpmOverlay(ctx);
  }

  // ---- 上部ヘッダー ----
  drawHeader(ctx) {
    const song = this.songs[this.selectedSong];
    const course = song ? song.courses[this.selectedDiff] : null;

    const grad = ctx.createLinearGradient(0, 0, 0, HEADER_H);
    grad.addColorStop(0, '#8e1212');
    grad.addColorStop(1, '#570a0a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, HEADER_H);

    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = '#ffd54f';
    ctx.fillStyle = '#ffd54f';
    for (let px = 60; px < W; px += 150) {
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, HEADER_H + 46, 92, Math.PI, Math.PI * 2);
      ctx.stroke();
      for (let a = 0; a <= 6; a++) {
        const ang = Math.PI + a * Math.PI / 6;
        ctx.beginPath();
        ctx.moveTo(px, HEADER_H + 46);
        ctx.lineTo(px + Math.cos(ang) * 92, HEADER_H + 46 + Math.sin(ang) * 92);
        ctx.stroke();
      }
    }
    for (let i = 0; i < 26; i++) {
      const fx = (i * 173 + 40) % W;
      const fy = (i * 67 + 15) % HEADER_H;
      ctx.beginPath(); ctx.arc(fx, fy, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, HEADER_H - 5, W, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(0, HEADER_H - 9, W, 2);

    // ---- キャラクター(左上) ----
    const avX = 96, avY = 64;
    ctx.fillStyle = '#ff5722';
    ctx.beginPath(); ctx.arc(avX, avY, 50, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3e0d04'; ctx.lineWidth = 4; ctx.stroke();
    const img = this.charFrame(this.gogoActive ? 'gogo' : 'char');
    if (img && img.width) {
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const sc = Math.min(190 / iw, 96 / ih);
      ctx.drawImage(img, avX + 6 - iw * sc / 2, avY + 4 - ih * sc / 2, iw * sc, ih * sc);
    }

    // ---- 1P ネームプレート ----
    ctx.fillStyle = '#ff6d00';
    this.roundRect(ctx, 232, 16, 74, 42, 10); ctx.fill();
    ctx.strokeStyle = '#7f2600'; ctx.lineWidth = 3;
    this.roundRect(ctx, 232, 16, 74, 42, 10); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 27px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('1P', 269, 47);

    ctx.fillStyle = '#fffdf5';
    this.roundRect(ctx, 310, 16, 250, 42, 10); ctx.fill();
    ctx.strokeStyle = '#c62828'; ctx.lineWidth = 3;
    this.roundRect(ctx, 310, 16, 250, 42, 10); ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 25px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(PLAYER_NAME, 328, 46);

    // ---- 曲名・ジャンル(右上) ----
    if (song) {
      // TITLEJA(和訳タイトル)がある場合はそちらを優先表示
      const title = (course && (course.headers.TITLEJA || course.headers.TITLE)) || song.name;
      ctx.textAlign = 'right';
      ctx.font = 'bold 40px "Hiragino Kaku Gothic ProN", sans-serif';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#000';
      ctx.strokeText(title, W - 28, 56);
      ctx.fillStyle = '#fff';
      ctx.fillText(title, W - 28, 56);

      const genre = (course && course.headers.GENRE) || 'ポップス';
      ctx.font = 'bold 17px sans-serif';
      const gw = ctx.measureText(genre).width + 28;
      const gGrad = ctx.createLinearGradient(0, 74, 0, 104);
      gGrad.addColorStop(0, '#ffe082');
      gGrad.addColorStop(1, '#d4a017');
      ctx.fillStyle = gGrad;
      this.roundRect(ctx, W - 28 - gw, 74, gw, 30, 6); ctx.fill();
      ctx.strokeStyle = '#7a5b00'; ctx.lineWidth = 2;
      this.roundRect(ctx, W - 28 - gw, 74, gw, 30, 6); ctx.stroke();
      ctx.fillStyle = '#4e2c00';
      ctx.textAlign = 'center';
      ctx.fillText(genre, W - 28 - gw / 2, 95);
    }

    // ---- 魂ゲージ ----
    const gx = 800, gw2 = 420, gy = 110, gh = 18;
    ctx.fillStyle = 'rgba(255, 202, 40, 0.30)';
    ctx.fillRect(gx + gw2 * 0.8, gy - 4, gw2 * 0.2, gh + 8);
    ctx.strokeStyle = 'rgba(255, 202, 40, 0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(gx + gw2 * 0.8, gy - 4, gw2 * 0.2, gh + 8);
    ctx.fillStyle = '#ffca28';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('クリア', gx + gw2 * 0.9, gy - 10);

    ctx.fillStyle = '#2a0d05';
    ctx.fillRect(gx, gy, gw2, gh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeRect(gx, gy, gw2, gh);
    if (this.soul > 0.001) {
      const fGrad = ctx.createLinearGradient(gx, 0, gx + gw2, 0);
      fGrad.addColorStop(0, '#ffca28');
      fGrad.addColorStop(1, '#ff6f00');
      ctx.fillStyle = fGrad;
      ctx.fillRect(gx + 2, gy + 2, (gw2 - 4) * this.soul, gh - 4);
    }
    // 魂の炎は判定枠側に表示する(ゲージ横ではなく)
    ctx.font = 'bold 32px "Hiragino Kaku Gothic ProN", sans-serif';
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#000';
    ctx.textAlign = 'right';
    ctx.strokeText('魂', W - 22, 130);
    ctx.fillStyle = '#fff';
    ctx.fillText('魂', W - 22, 130);
  }

  // ---- ノーツレーン + 左パネル ----
  drawLane(ctx, musicTime) {
    const pGrad = ctx.createLinearGradient(0, HEADER_H, 0, SCENE_Y);
    pGrad.addColorStop(0, '#a31414');
    pGrad.addColorStop(1, '#7d0d0d');
    ctx.fillStyle = pGrad;
    ctx.fillRect(0, HEADER_H, PANEL_W, SCENE_Y - HEADER_H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(PANEL_W - 3, HEADER_H, 3, SCENE_Y - HEADER_H);

    ctx.textAlign = 'left';
    ctx.font = 'bold 42px "Arial Black", sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#000';
    ctx.strokeText(String(this.score), 22, 182);
    ctx.fillStyle = '#fff';
    ctx.fillText(String(this.score), 22, 182);

    const course = this.songs[this.selectedSong] ? this.songs[this.selectedSong].courses[this.selectedDiff] : null;
    const diffNames = course ? (course.headers.COURSE || 'Oni') : 'Oni';
    const diffLabels = { Easy: 'かんたん', Normal: 'ふつう', Hard: 'むずかしい', Oni: 'おに', Edit: 'えでぃっと' };
    const diffColors = { Easy: '#ffb300', Normal: '#7cb342', Hard: '#546e7a', Oni: '#c2185b', Edit: '#5e35b1' };
    const badgeKey = diffNames.charAt(0).toUpperCase() + diffNames.slice(1).toLowerCase();

    // 難易度徽章(edit/oni/hard/normal/easy.png)
    const badge = this.courseBadges && this.courseBadges[badgeKey];
    if (badge && badge.complete && badge.naturalWidth) {
      const bw = 52, bh = 52 * badge.naturalHeight / badge.naturalWidth;
      ctx.drawImage(badge, 66 - bw / 2, 208 - bh / 2, bw, bh);
    } else {
      ctx.fillStyle = diffColors[badgeKey] || '#c2185b';
      ctx.beginPath(); ctx.arc(66, 208, 26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff';
      this.drawStar(ctx, 66, 208, 5, 15, 7);
    }

    // ミニ太鼓(入力表示): 叩いた側のハイライトを重ねる
    const mx = 66, my = 266;
    const lt = 0.15;
    const lDon = this.lastLeftDonAt !== undefined && (this.animTime - this.lastLeftDonAt) < lt;
    const rDon = this.lastRightDonAt !== undefined && (this.animTime - this.lastRightDonAt) < lt;
    const lKa = this.lastLeftKaAt !== undefined && (this.animTime - this.lastLeftKaAt) < lt;
    const rKa = this.lastRightKaAt !== undefined && (this.animTime - this.lastRightKaAt) < lt;
    const tk = this.tkImages;
    const tkOk = tk && tk.frame && tk.frame.complete && tk.frame.naturalWidth;
    const anyHit = lDon || rDon || lKa || rKa;
    ctx.save();
    ctx.translate(mx, my);
    if (anyHit) ctx.scale(1.1, 1.1);
    if (tkOk) {
      const fw = 60, fh = 60 * tk.frame.naturalHeight / tk.frame.naturalWidth;
      ctx.drawImage(tk.frame, -fw / 2, -fh / 2, fw, fh);
      const ov = (img) => img && img.complete && img.naturalWidth;
      if (lDon && ov(tk.left_don)) ctx.drawImage(tk.left_don, -fw / 2, -fh / 2, fw, fh);
      if (rDon && ov(tk.right_don)) ctx.drawImage(tk.right_don, -fw / 2, -fh / 2, fw, fh);
      if (lKa && ov(tk.left_ka)) ctx.drawImage(tk.left_ka, -fw / 2, -fh / 2, fw, fh);
      if (rKa && ov(tk.right_ka)) ctx.drawImage(tk.right_ka, -fw / 2, -fh / 2, fw, fh);
    } else {
      const donFlash = lDon || rDon, kaFlash = lKa || rKa;
      const mr = 30;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, mr + 4, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.rect(-mr, -mr, mr, mr * 2); ctx.clip();
      ctx.fillStyle = this.bodyColor;
      ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill();
      if (donFlash) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -mr, mr, mr * 2); ctx.clip();
      ctx.fillStyle = '#3fb9e8';
      ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill();
      if (kaFlash) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      ctx.strokeStyle = '#26130b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -mr); ctx.lineTo(0, mr); ctx.stroke();
    }
    ctx.restore();
    // キー表記(左右)
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText('F/J', mx - 48, my + 4);
    ctx.strokeText('D/K', mx + 48, my + 4);
    ctx.fillStyle = '#fff';
    ctx.fillText('F/J', mx - 48, my + 4);
    ctx.fillText('D/K', mx + 48, my + 4);

    // 難易度ラベル
    ctx.font = 'bold 15px sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeText(diffLabels[diffNames] || diffNames, 66, 310);
    ctx.fillText(diffLabels[diffNames] || diffNames, 66, 310);


    ctx.fillStyle = '#161619';
    ctx.fillRect(PANEL_W, LANE_Y, W - PANEL_W, LANE_H);
    const laneGrad = ctx.createLinearGradient(0, LANE_Y, 0, LANE_Y + LANE_H);
    laneGrad.addColorStop(0, 'rgba(255,255,255,0.05)');
    laneGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
    laneGrad.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = laneGrad;
    ctx.fillRect(PANEL_W, LANE_Y, W - PANEL_W, LANE_H);
    ctx.fillStyle = '#3a3a3f';
    ctx.fillRect(PANEL_W, LANE_Y - 4, W - PANEL_W, 4);
    ctx.fillRect(PANEL_W, LANE_Y + LANE_H, W - PANEL_W, 4);

    // 魂の炎(GOGO中のみ・2.5倍・フレーム1〜6) ※ノーツ・判定枠の下に半透明で
    if (this.gogoActive) {
      const soulArr = this.assets.soul;
      if (soulArr && soulArr.length) {
        const sImg = soulArr[1 + Math.floor(this.animTime * 10) % 6];
        if (sImg && sImg.complete && sImg.naturalWidth) {
          ctx.save();
          ctx.globalAlpha = 0.5;
          ctx.drawImage(sImg, this.judgeLineX - 137, LANE_CY - 137, 275, 275);
          ctx.restore();
        }
      }
    }

    for (let ml of this.measureLines) {
      const mx = this.judgeLineX + (ml.time - musicTime) * this.noteSpeed * this.hs * ml.scroll;
      if (mx < PANEL_W || mx > W) continue;
      ctx.strokeStyle = 'rgba(255,255,255,0.20)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 10]);
      ctx.beginPath();
      ctx.moveTo(mx, LANE_Y + 6);
      ctx.lineTo(mx, LANE_Y + LANE_H - 6);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (let roll of this.rolls) {
      if (roll.hit) continue;
      if (roll.endX < PANEL_W - 60 || roll.startX > W + 60) continue;
      const sx = Math.max(roll.startX, PANEL_W);
      const ex = Math.min(roll.endX, W);
      if (ex <= sx) continue;
      const isBig = roll.type === 'big_roll';
      const barH = isBig ? 46 : 32;
      const barY = LANE_CY - barH / 2;
      ctx.fillStyle = isBig ? 'rgba(255, 143, 0, 0.5)' : 'rgba(255, 202, 40, 0.42)';
      this.roundRect(ctx, sx, barY, ex - sx, barH, 8); ctx.fill();
      ctx.strokeStyle = isBig ? '#ff8f00' : '#ffca28';
      ctx.lineWidth = isBig ? 3 : 2;
      this.roundRect(ctx, sx, barY, ex - sx, barH, 8); ctx.stroke();
      ctx.save();
      this.roundRect(ctx, sx, barY, ex - sx, barH, 8);
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 3;
      for (let ox = sx - 20; ox < ex + 20; ox += 14) {
        ctx.beginPath();
        ctx.moveTo(ox, barY + barH);
        ctx.lineTo(ox + 16, barY);
        ctx.stroke();
      }
      ctx.restore();
      if (roll.hits > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(roll.hits), (sx + ex) / 2, barY - 8);
      }
    }

    for (let note of this.notes) {
      if (note.hit || note.x < -60 || note.x > W + 60) continue;
      this.drawNoteFace(ctx, note.x, LANE_CY, note.type);
    }

    for (let balloon of this.balloons) {
      if (balloon.popped) {
        // 破裂アニメーション(判定枠で割れた瞬間)
        if (balloon.poppedAt !== undefined && musicTime - balloon.poppedAt < 0.35) {
          const pp = (musicTime - balloon.poppedAt) / 0.35;
          ctx.strokeStyle = `rgba(255, 105, 180, ${1 - pp})`;
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(this.judgeLineX + 62, LANE_CY - 34, 20 + pp * 45, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = `rgba(255, 105, 180, ${(1 - pp) * 0.5})`;
          for (let k = 0; k < 6; k++) {
            const a = k * Math.PI / 3 + 0.5;
            ctx.beginPath();
            ctx.arc(this.judgeLineX + 62 + Math.cos(a) * (15 + pp * 40), LANE_CY - 34 + Math.sin(a) * (15 + pp * 40), 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        continue;
      }
      if (balloon.x < -80 || balloon.x > W + 80) continue;
      const shake = (balloon.hit && !balloon.popped) ? Math.sin(musicTime * 30) * 3 : 0;
      const bx = balloon.x + shake;
      // オレンジの音符 + 右側に風船(円)
      const nr = 20;
      const bpx = bx + 62, bpy = LANE_CY - 34, br = 26;
      // 音符(オレンジ・ドン顔)
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(bx, LANE_CY, nr + 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff9800';
      ctx.beginPath(); ctx.arc(bx, LANE_CY, nr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#e65100'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#26130b';
      ctx.beginPath(); ctx.ellipse(bx - 7, LANE_CY - 3, 2.6, 3.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(bx + 7, LANE_CY - 3, 2.6, 3.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#26130b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx - 2.5, LANE_CY + 5, 2.6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(bx + 2.5, LANE_CY + 5, 2.6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      // ひも(音符→風船)
      ctx.strokeStyle = '#8d5524'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(bx + nr - 2, LANE_CY - 8);
      ctx.quadraticCurveTo(bx + 40, LANE_CY - 18, bpx - br * 0.5, bpy + br * 0.6);
      ctx.stroke();
      // 風船本体(右側の円)
      ctx.fillStyle = '#ff69b4';
      ctx.beginPath(); ctx.arc(bpx, bpy, br, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ad1457'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.ellipse(bpx - br * 0.3, bpy - br * 0.3, br * 0.28, br * 0.2, -0.4, 0, Math.PI * 2); ctx.fill();
      // 残り回数
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      const remain = balloon.hit ? Math.max(0, balloon.hitsRequired - balloon.hits) : balloon.hitsRequired;
      ctx.fillText(String(remain), bpx, bpy + 6);
    }

    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(this.judgeLineX, LANE_CY, 52, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.judgeLineX, LANE_CY, 60, 0, Math.PI * 2); ctx.stroke();
    if (this.charHitT > 0) {
      const p = 1 - this.charHitT / 0.25;
      ctx.strokeStyle = `rgba(255, 235, 100, ${1 - p})`;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(this.judgeLineX, LANE_CY, 52 + p * 30, 0, Math.PI * 2); ctx.stroke();
    }

    for (let eff of this.hitEffects) {
      const age = musicTime - eff.time;
      const alpha = 1 - (age / eff.life);
      ctx.textAlign = 'center';
      if (eff.type === 'perfect') {
        ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
        ctx.font = `bold ${34 + age * 70}px sans-serif`;
        ctx.fillText('良', eff.x, eff.y - 62 - age * 40);
      } else if (eff.type === 'good') {
        ctx.fillStyle = `rgba(0, 255, 127, ${alpha})`;
        ctx.font = `bold ${30 + age * 55}px sans-serif`;
        ctx.fillText('可', eff.x, eff.y - 55 - age * 35);
      } else if (eff.type === 'miss') {
        ctx.fillStyle = `rgba(160, 160, 160, ${alpha})`;
        ctx.font = `bold ${30 + age * 45}px sans-serif`;
        ctx.fillText('不可', eff.x, eff.y - 55 - age * 35);
      }
    }

    // コンボ表示(ミニ太鼓マークの中央に中央ぞろえ / 5コンボから / 50で銀・100で金)
    if (this.combo >= 5) {
      const comboColor = this.combo >= 100 ? '#ffca28' : this.combo >= 50 ? '#d5dbe0' : '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px "Arial Black", sans-serif';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#26130b';
      ctx.strokeText(String(this.combo), 66, 266);
      ctx.fillStyle = comboColor;
      ctx.fillText(String(this.combo), 66, 266);
      ctx.font = 'bold 10px sans-serif';
      ctx.lineWidth = 3;
      ctx.strokeText('combo', 66, 279);
      ctx.fillText('combo', 66, 279);
    }

    // カウントイン表示(音楽開始前の待機中)
    if (this.isPlaying && !this.audio.isPlaying && this.gameStartAt) {
      const remain = LEAD_IN - (performance.now() - this.gameStartAt) / 1000;
      if (remain > 0) {
        const label = remain > 0.4 ? String(Math.ceil(remain - 0.001)) : 'GO!';
        ctx.textAlign = 'center';
        ctx.font = 'bold 90px "Arial Black", sans-serif';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#4e2600';
        ctx.strokeText(label, W / 2, LANE_CY + 32);
        ctx.fillStyle = '#ffd54f';
        ctx.fillText(label, W / 2, LANE_CY + 32);
      }
    }

    if (this.autoPlay) {
      ctx.fillStyle = '#ff5252';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('🤖 AUTO', PANEL_W + 12, LANE_Y - 10);
    }

    if (this.gogoActive) {
      const pop = 1 + Math.sin(this.animTime * 8) * 0.06;
      ctx.save();
      ctx.translate(W / 2, 348);
      ctx.scale(pop, pop);
      ctx.textAlign = 'center';
      ctx.font = 'bold 44px "Arial Black", sans-serif';
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#7f2600';
      ctx.strokeText('GO GO TIME！', 0, 0);
      const gg = ctx.createLinearGradient(0, -40, 0, 10);
      gg.addColorStop(0, '#ffe082');
      gg.addColorStop(1, '#ff6f00');
      ctx.fillStyle = gg;
      ctx.fillText('GO GO TIME！', 0, 0);
      ctx.restore();
    }
  }

  // ---- ドンちゃん顔ノーツ ----
  drawNoteFace(ctx, x, y, type) {
    const don = (type === 1 || type === 3);
    const big = (type === 3 || type === 4);
    const r = big ? 36 : 27;
    const col = don ? this.bodyColor : '#3fb9e8';
    const edge = don ? '#7a0000' : '#01579b';
    const inner = don ? '#ff8a75' : '#8fdcf5';

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    if (big) {
      ctx.fillStyle = inner;
      ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#26130b';
    const ey = y - r * 0.12;
    ctx.beginPath(); ctx.ellipse(x - r * 0.32, ey, r * 0.10, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * 0.32, ey, r * 0.10, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#26130b';
    ctx.lineWidth = r * 0.09;
    ctx.beginPath(); ctx.arc(x - r * 0.11, y + r * 0.20, r * 0.12, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + r * 0.11, y + r * 0.20, r * 0.12, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(x - r * 0.48, y + r * 0.14, r * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.48, y + r * 0.14, r * 0.12, 0, Math.PI * 2); ctx.fill();
  }

  // ---- 縁日シーン(下部) ----
  drawFestival(ctx, t, gogo, firePhase = null) {
    const sky = ctx.createLinearGradient(0, SCENE_Y, 0, H);
    sky.addColorStop(0, gogo ? '#4a1208' : '#33100c');
    sky.addColorStop(1, '#120404');
    ctx.fillStyle = sky;
    ctx.fillRect(0, SCENE_Y, W, H - SCENE_Y);

    this.drawLanternString(ctx, 356, 0, t);
    this.drawLanternString(ctx, 396, 55, t);

    this.drawCandyStall(ctx, 36, 408);
    this.drawTakoyakiStall(ctx, 470, 380, t);
    this.drawKakigoriStall(ctx, 972, 402);

    if (gogo) {
      ctx.fillStyle = 'rgba(255, 120, 0, 0.07)';
      ctx.fillRect(0, SCENE_Y, W, H - SCENE_Y);
    }

    // GOGO開始時のみ: 下側に花火を3本表示(firePhaseはGOGO開始からの経過秒)
    if (firePhase !== null) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const spots = [[170, 480], [640, 505], [1110, 480]];
      for (let k = 0; k < 3; k++) {
        const arr = this.assets.fire;
        if (!arr || !arr.length) break;
        const f = arr[Math.floor(firePhase * 10 + k * 2.7) % arr.length];
        if (f && f.complete && f.naturalWidth) {
          ctx.globalAlpha = 0.85;
          ctx.drawImage(f, spots[k][0] - 45, spots[k][1] - 90, 90, 180);
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#7f0000';
    ctx.fillRect(0, 604, W, 4);
    const stripeW = 36;
    for (let i = 0; i * stripeW < W; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#d32f2f' : '#fff8f0';
      ctx.fillRect(i * stripeW, 608, stripeW, H - 608);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 608, W, 4);
  }

  drawLanternString(ctx, y, phase, t) {
    ctx.strokeStyle = 'rgba(60, 20, 10, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, y - 14);
    ctx.quadraticCurveTo(W / 2, y + 22, W, y - 14);
    ctx.stroke();
    const colors = ['#76ff03', '#ffea00', '#ff4081', '#ff9100', '#40c4ff', '#e040fb'];
    for (let i = 0; i < 14; i++) {
      const lx = 46 + i * 90 + phase;
      if (lx > W) break;
      const u = lx / W;
      const ly = (y - 14) + (1 - Math.pow(2 * u - 1, 2)) * 36;
      const c = colors[i % colors.length];
      const pulse = 0.75 + Math.sin(t * 3 + i * 1.7) * 0.25;
      const glow = ctx.createRadialGradient(lx, ly + 10, 2, lx, ly + 10, 26);
      glow.addColorStop(0, c);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.35 * pulse;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(lx, ly + 10, 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(lx, ly + 10, 11, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.ellipse(lx - 3, ly + 6, 3, 4, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5d2100';
      ctx.fillRect(lx - 6, ly - 4, 12, 4);
      ctx.fillRect(lx - 5, ly + 22, 10, 3);
    }
  }

  drawAwning(ctx, x, y, w, h, c1, c2) {
    const n = Math.max(3, Math.round(w / 30));
    const sw = w / n;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i % 2 === 0 ? c1 : c2;
      ctx.beginPath();
      ctx.moveTo(x + i * sw, y);
      ctx.lineTo(x + (i + 1) * sw, y);
      ctx.lineTo(x + (i + 1) * sw - 6, y + h);
      ctx.lineTo(x + i * sw + 6, y + h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.arc(x + i * sw + sw / 2, y + h, sw / 2 - 2, 0, Math.PI);
      ctx.fill();
    }
  }

  drawBpmOverlay(ctx) {
    const course = this.songs[this.selectedSong] ? this.songs[this.selectedSong].courses[this.selectedDiff] : null;
    if (!course) return;

    ctx.fillText(`HS: ${hs}`, 16, 614);

  drawStar(ctx, cx, cy, spikes, outerR, innerR) {
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (i * Math.PI / spikes) - Math.PI / 2;
      const px = cx + Math.cos(a) * r;
      const py = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
