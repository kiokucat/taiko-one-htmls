  // 曲リストレイアウト(ジャンルごとにグルーピングした描画用レイアウト)
  buildSongListLayout() {
    const groups = [];
    const map = new Map();
    const q = (this.searchQuery || '').trim().toLowerCase();
    for (let i = 0; i < this.songs.length; i++) {
      // 検索フィルタ(曲名/TITLE/TITLEJA/ジャンル)
      if (q) {
        const c0 = this.songs[i].courses[0] || { headers: {} };
        const hay = [this.songs[i].name, c0.headers.TITLE, c0.headers.TITLEJA, this.songs[i].genre, c0.headers.GENRE]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) continue;
      }
      const genre = this.songs[i].genre
                 || (this.songs[i].courses[0] && this.songs[i].courses[0].headers.GENRE)
                 || 'その他';
      if (!map.has(genre)) {
        const grp = { genre, items: [] };
        map.set(genre, grp);
        groups.push(grp);
      }
      map.get(genre).items.push(i);
    }
    const layout = [];
    let y = 170;
    for (const grp of groups) {
      layout.push({ type: 'header', genre: grp.genre, y });
      y += 46;
      for (const i of grp.items) {
        layout.push({ type: 'song', index: i, y });
        y += 76;
      }
    }
    this._listTotalH = Math.max(0, y - 170);
    return layout;
  }

  // ==================== 曲選択 ====================
  drawSongSelect() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8e1212'); g.addColorStop(1, '#3a0909');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    this.drawLanternString(ctx, 90, 0, this.animTime);
    ctx.fillStyle = '#fff8e1';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎵 曲選択', W/2, 130);

    const layout = this.buildSongListLayout();
    const diffColors = { Easy: '#ffb300', Normal: '#fb8c00', Hard: '#f4511e', Oni: '#c2185b', Edit: '#8e24aa' };
    for (const row of layout) {
      const y = row.y - this.scrollOffset;
      if (row.type === 'header') {
        if (y < -50 || y > H) continue;
        // ジャンルヘッダー
        ctx.fillStyle = 'rgba(255, 202, 40, 0.16)';
        this.roundRect(ctx, 90, y, W - 180, 38, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 202, 40, 0.55)';
        ctx.lineWidth = 2;
        this.roundRect(ctx, 90, y, W - 180, 38, 8); ctx.stroke();
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('♪ ' + row.genre, 112, y + 27);
        continue;
      }
      const i = row.index;
      if (y < -76 || y > H) continue;
      const selected = i === this.selectedSong;
      ctx.fillStyle = selected ? 'rgba(255,179,0,0.5)' : '#fff8e1';
      this.roundRect(ctx, 90, y, W - 180, 64, 10); ctx.fill();
      ctx.strokeStyle = selected ? '#ffe082' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = selected ? 4 : 2;
      this.roundRect(ctx, 90, y, W - 180, 64, 10); ctx.stroke();
      ctx.fillStyle = '#4e2c1e';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'left';
      const dispName = (this.songs[i].courses[0] && (this.songs[i].courses[0].headers.TITLEJA || this.songs[i].courses[0].headers.TITLE)) || this.songs[i].name;
      ctx.fillText(dispName, 120, y + 42);
      const courses = this.songs[i].courses;
      ctx.textAlign = 'center';
      for (let j = 0; j < courses.length; j++) {
        const dn = courses[j].headers.COURSE || 'Oni';
        ctx.fillStyle = diffColors[dn] || '#888';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(`${dn} ${courses[j].headers.LEVEL || '?'}`, W - 260 + j * 95, y + 42);
      }
    }
    ctx.fillStyle = '#ffe0b2';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('↑↓ で選択 / Enter で決定 / Esc で戻る / 曲数: ' + this.songs.length, W/2, H - 18);
  }

  // ==================== 難易度選択 ====================
  drawDifficulty() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8e1212'); g.addColorStop(1, '#3a0909');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const song = this.songs[this.selectedSong];
    const dispTitle = (song.courses[0] && (song.courses[0].headers.TITLEJA || song.courses[0].headers.TITLE)) || song.name;
    ctx.fillStyle = '#fff8e1';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(dispTitle, W/2, 90);
    ctx.fillStyle = '#ffe0b2';
    ctx.font = '18px sans-serif';
    ctx.fillText('難易度を選択してください', W/2, 122);

    const courses = song.courses;
    const diffColors = { Easy: '#ffb300', Normal: '#fb8c00', Hard: '#f4511e', Oni: '#c2185b', Edit: '#8e24aa' };
    const diffLabels = { Easy: 'かんたん', Normal: 'ふつう', Hard: 'むずかしい', Oni: 'おに', Edit: 'えでぃっと' };
    const cardW = 170, cardH = 210, gap = 20;
    const totalWidth = courses.length * cardW + (courses.length - 1) * gap;
    const startX = W/2 - totalWidth/2 - this.diffScrollX;
    const maxScroll = Math.max(0, totalWidth - W + 100);
    this.diffScrollX = Math.max(0, Math.min(this.diffScrollX, maxScroll));

    for (let i = 0; i < courses.length; i++) {
      const x = startX + i * (cardW + gap);
      if (x + cardW < 0 || x > W) continue;
      const selected = i === this.selectedDiff;
      const dn = courses[i].headers.COURSE || 'Oni';
      const color = diffColors[dn] || '#fff';
      ctx.fillStyle = selected ? color : '#fff8e1';
      ctx.globalAlpha = selected ? 0.35 : 1;
      this.roundRect(ctx, x, 170, cardW, cardH, 12); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = selected ? color : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = selected ? 5 : 2;
      this.roundRect(ctx, x, 170, cardW, cardH, 12); ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(diffLabels[dn] || dn, x + cardW/2, 225);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 52px sans-serif';
      ctx.fillText('★' + (courses[i].headers.LEVEL || '?'), x + cardW/2, 300);
      const noteCount = courses[i].measures.reduce((s, m) => s + (m.notes ? m.notes.replace(/0/g, '').length : 0), 0);
      ctx.fillStyle = '#ffcc9e';
      ctx.font = '15px sans-serif';
      ctx.fillText(`ノーツ数: ${noteCount}`, x + cardW/2, 350);
    }
    ctx.fillStyle = '#ffe0b2';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('←→ で選択 / Enter で開始 / Esc で戻る', W/2, H - 24);
  }

  // ==================== リザルト ====================
  drawResult() {
    const ctx = this.ctx;
    ctx.fillStyle = '#1a0606';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const spots = [[240, 180], [640, 120], [1040, 190]];
    for (let k = 0; k < spots.length; k++) {
      const f = this.assets.fire[Math.floor(this.animTime * 18 + k * 11) % this.assets.fire.length];
      if (f && f.complete && f.naturalWidth) {
        ctx.globalAlpha = 0.9;
        ctx.drawImage(f, spots[k][0] - 55, spots[k][1] - 110, 110, 220);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    const total = this.perfect + this.good + this.miss;
    const accuracy = total > 0 ? Math.round((this.perfect * 100 + this.good * 50) / total) : 0;

    ctx.fillStyle = '#fffdf5';
    this.roundRect(ctx, 390, 110, 500, 430, 16); ctx.fill();
    ctx.strokeStyle = '#c62828'; ctx.lineWidth = 6;
    this.roundRect(ctx, 390, 110, 500, 430, 16); ctx.stroke();
    ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 2;
    this.roundRect(ctx, 402, 122, 476, 406, 12); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#e65100';
    ctx.font = 'bold 46px "Arial Black", sans-serif';
    ctx.fillText('RESULT', 640, 172);
    ctx.fillStyle = '#4e2c1e';
    ctx.font = '25px sans-serif';
    const rows = [`Score: ${this.score}`, `Max Combo: ${this.maxCombo}`, ``,
                  `良: ${this.perfect}`, `可: ${this.good}`, `不可: ${this.miss}`,
                  `Accuracy: ${accuracy}%`];
    for (let i = 0; i < rows.length; i++) ctx.fillText(rows[i], 640, 220 + i * 35);
    let rank = 'C';
    if (accuracy >= 95) rank = 'SSS'; else if (accuracy >= 90) rank = 'SS';
    else if (accuracy >= 80) rank = 'S'; else if (accuracy >= 70) rank = 'A';
    else if (accuracy >= 60) rank = 'B';
    ctx.fillStyle = '#e53935';
    ctx.font = 'bold 60px "Arial Black", sans-serif';
    ctx.fillText('RANK ' + rank, 640, 500);
    ctx.fillStyle = '#8d6e63';
    ctx.font = '16px sans-serif';
    ctx.fillText('Enter またはクリックでタイトルへ', 640, 580);
  }

  // ==================== 入力 ====================
  input(isDon, side = 'left') {
    if (!this.isPlaying) return;
    // ミニ太鼓のハイライト用(左右×don/ka)
    if (isDon) {
      if (side === 'left') this.lastLeftDonAt = this.animTime; else this.lastRightDonAt = this.animTime;
    } else {
      if (side === 'left') this.lastLeftKaAt = this.animTime; else this.lastRightKaAt = this.animTime;
    }
    const musicTime = this.gameClock();
    const judgeWindow = 0.15;

    let target = null;
    let minDiff = Infinity;
    for (let note of this.notes) {
      if (note.hit) continue;
      const isNoteDon = (note.type === 1 || note.type === 3);
      const isNoteKa = (note.type === 2 || note.type === 4);
      if ((isDon && !isNoteDon) || (!isDon && !isNoteKa)) continue;
      const diff = Math.abs(note.time - musicTime);
      if (diff < judgeWindow && diff < minDiff) {
        minDiff = diff;
        target = note;
      }
    }
    if (target) {
      target.hit = true;
      this.charHitT = 0.25;
      if (minDiff < 0.05) {
        this.perfect++;
        this.combo++;
        if (this.combo % 10 === 0) this.comboFlashAt = this.animTime; // 10コンボ演出の起点
        if (COMBO_VOICE_THRESHOLDS.includes(this.combo)) this.audio.playComboVoice(this.combo);
        this.score = Math.min(999999, this.score + Math.round(this.pointPerfect + this.combo * this.comboK));
        this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'perfect', time: musicTime, life: 0.6 });
      } else {
        this.good++;
        this.combo++;
        if (this.combo % 10 === 0) this.comboFlashAt = this.animTime; // 10コンボ演出の起点
        if (COMBO_VOICE_THRESHOLDS.includes(this.combo)) this.audio.playComboVoice(this.combo);
        this.score = Math.min(999999, this.score + Math.round(this.pointGood + this.combo * this.comboK * 0.5));
        this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'good', time: musicTime, life: 0.5 });
      }
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      this.audio.playSE(isDon ? 'don' : 'ka');
      return;
    }

    for (let roll of this.rolls) {
      if (roll.hit) continue;
      if (musicTime >= roll.startTime - 0.1 && musicTime <= roll.endTime + 0.2) {
        const sx = this.judgeLineX + (roll.startTime - musicTime) * this.noteSpeed * this.hs * roll.scroll;
        const ex = this.judgeLineX + (roll.endTime - musicTime) * this.noteSpeed * this.hs * roll.scroll;
        if (sx <= this.judgeLineX + 30 && ex >= this.judgeLineX - 30) {
          roll.hits++;
          this.charHitT = 0.25;
          this.score = Math.min(999999, this.score + Math.round((this.pointPerfect || 300) * 0.3));
          this.audio.playSE('don');
          return;
        }
      }
    }

    for (let balloon of this.balloons) {
      if (balloon.popped) continue;
      if (!balloon.hit && Math.abs(balloon.time - musicTime) < 0.15) {
        balloon.hit = true;
        balloon.hits++;
        this.charHitT = 0.25;
        this.combo++;
        if (this.combo % 10 === 0) this.comboFlashAt = this.animTime; // 10コンボ演出の起点
        if (COMBO_VOICE_THRESHOLDS.includes(this.combo)) this.audio.playComboVoice(this.combo);
        this.score = Math.min(999999, this.score + Math.round((this.pointPerfect || 300) * 0.3));
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
        this.audio.playSE('don');
      } else if (balloon.hit && !balloon.popped && musicTime > balloon.time && musicTime <= balloon.endTime) {
        balloon.hits++;
        this.charHitT = 0.25;
        this.combo++;
        if (this.combo % 10 === 0) this.comboFlashAt = this.animTime; // 10コンボ演出の起点
        if (COMBO_VOICE_THRESHOLDS.includes(this.combo)) this.audio.playComboVoice(this.combo);
        this.score = Math.min(999999, this.score + Math.round((this.pointPerfect || 300) * 0.3));
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
        this.audio.playSE('don');
      } else {
        continue;
      }
      if (balloon.hits >= balloon.hitsRequired) {
        balloon.popped = true;
        balloon.poppedAt = musicTime;
        this.perfect++;
        this.hitEffects.push({ x: this.judgeLineX, y: LANE_CY, type: 'perfect', time: musicTime, life: 0.6 });
      }
      return;
    }

    this.audio.playSE(isDon ? 'don' : 'ka');
  }

  // ==================== クリック ====================
  handleClick(mx, my) {
    const rect = this.canvas.getBoundingClientRect();
    const x = (mx - rect.left) * (W / rect.width);
    const y = (my - rect.top) * (H / rect.height);
    if (this.screen === 'title') {
      const menus = ['game', 'folder', 'help'];
      for (let i = 0; i < 3; i++) {
        const cy = 520 + i * 40;
        if (x > W/2 - 170 && x < W/2 + 170 && y > cy - 26 && y < cy + 8) {
          if (menus[i] === 'game') {
            if (this.songs.length > 0) {
              this.screen = 'songSelect';
              this.selectedSong = 0;
            }
          } else if (menus[i] === 'folder') {
            document.getElementById('folderInput').click();
          }
        }
      }
    } else if (this.screen === 'songSelect') {
      // ジャンル分けレイアウトに基づいてクリック位置を判定(旧: 平坦レイアウトでずれていた)
      const layout = this.buildSongListLayout();
      for (const row of layout) {
        if (row.type !== 'song') continue;
        const iy = row.y - this.scrollOffset;
        if (x > 90 && x < W - 90 && y > iy && y < iy + 64) {
          this.selectedSong = row.index;
          this.screen = 'difficulty';
          this.selectedDiff = 0;
          this.diffScrollX = 0;
          return;
        }
      }
    } else if (this.screen === 'difficulty') {
      const song = this.songs[this.selectedSong];
      const courses = song.courses;
      const cardW = 170, cardH = 210, gap = 20;
      const totalWidth = courses.length * cardW + (courses.length - 1) * gap;
      const startX = W/2 - totalWidth/2 - this.diffScrollX;
      for (let i = 0; i < courses.length; i++) {
        const cx = startX + i * (cardW + gap);
        if (x > cx && x < cx + cardW && y > 170 && y < 170 + cardH) {
          this.selectedDiff = i;
          this.loadCourse(courses[i]);
          this.startGame();
          return;
        }
      }
    } else if (this.screen === 'result') {
      this.screen = 'title';
    }
  }

  // ==================== キー ====================
  handleKey(e) {
    if (this.screen === 'title') {
      if (e.key === 'Enter' && this.songs.length > 0) {
        this.screen = 'songSelect';
        this.selectedSong = 0;
      }
    } else if (this.screen === 'songSelect') {
      if (e.key === 'ArrowUp') this.selectedSong = Math.max(0, this.selectedSong - 1);
      else if (e.key === 'ArrowDown') this.selectedSong = Math.min(this.songs.length - 1, this.selectedSong + 1);
      else if (e.key === 'Enter') {
        this.screen = 'difficulty';
        this.selectedDiff = 0;
        this.diffScrollX = 0;
      } else if (e.key === 'Escape') this.screen = 'title';
    } else if (this.screen === 'difficulty') {
      const song = this.songs[this.selectedSong];
      if (e.key === 'ArrowLeft') this.selectedDiff = Math.max(0, this.selectedDiff - 1);
      else if (e.key === 'ArrowRight') this.selectedDiff = Math.min(song.courses.length - 1, this.selectedDiff + 1);
      else if (e.key === 'Enter') {
        this.loadCourse(song.courses[this.selectedDiff]);
        this.startGame();
      } else if (e.key === 'Escape') this.screen = 'songSelect';
    } else if (this.screen === 'playing') {
      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        this.input(true, 'left');
      } else if (e.key === 'j' || e.key === 'J') {
        e.preventDefault();
        this.input(true, 'right');
      } else if (e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        this.input(false, 'left');
      } else if (e.key === 'k' || e.key === 'K') {
        e.preventDefault();
        this.input(false, 'right');
      } else if (e.key === '-' || e.key === '_') {
        this.hs = Math.max(0.5, Math.round((this.hs - 0.5) * 10) / 10);
      } else if (e.key === '=' || e.key === '+' || e.key === ';') {
        this.hs = Math.min(4.0, Math.round((this.hs + 0.5) * 10) / 10);
      } else if (e.key === 'Escape') {
        this.stopGame();
        this.screen = 'songSelect';
      }
    } else if (this.screen === 'result') {
      if (e.key === 'Enter' || e.key === 'Escape') this.screen = 'title';
    }
  }
}

// ==================== メイン ====================
const canvas = document.getElementById('gameCanvas');
const audio = new AudioManager();
const game = new GameEngine(canvas, audio);
const loader = new SongLoader();

(async () => {
  await game.loadAssets(p => {
    document.getElementById('loadFill').style.width = Math.round(p * 100) + '%';
  });
  document.getElementById('loading').classList.add('hidden');
  audio.loadSE(game.manifest).catch(() => {}); // don.ogg/ka.ogg/コンボボイス(非同期・失敗しても続行)
  await audio.generateDemoMusic();
  const demoCourses = loader.parser.parse(DEMO_TJA);
  game.songs.push({ name: 'デモ曲「打の魂」', courses: demoCourses, audioBuffer: audio.musicBuffer, isBuiltIn: true });
})();

document.getElementById('btnBack').addEventListener('click', () => {
  if (game.screen === 'playing') game.stopGame();
  game.screen = 'title';
});
document.getElementById('btnReload').addEventListener('click', () => location.reload());
document.getElementById('btnAuto').addEventListener('click', () => {
  game.autoPlay = !game.autoPlay;
  const btn = document.getElementById('btnAuto');
  btn.textContent = game.autoPlay ? '🤖 AUTO:ON' : '🤖 AUTO:OFF';
  btn.style.background = game.autoPlay ? '#2e9e5b' : '';
});

// 体色ピッカー: ドンノーツ/フォールバック太鼓の色を変更(b1/b2廃止に伴い即時反映のみ)
document.getElementById('bodyColorInput').addEventListener('input', (e) => {
  game.bodyColor = e.target.value;
  game.buildComposites();
});

// 検索ボックス
document.getElementById('searchBox').addEventListener('input', (e) => {
  game.searchQuery = e.target.value;
  game.scrollOffset = 0;
});

document.getElementById('folderInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  const loaded = await loader.handleFiles(files);
  for (let s of loaded) {
    if (!game.songs.find(x => x.name === s.name)) game.songs.push(s);
  }
  if (loaded.length > 0) {
    game.screen = 'songSelect';
    game.selectedSong = Math.max(0, game.songs.length - loaded.length);
  }
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.getElementById('dropZone').style.display = 'flex';
});
document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) document.getElementById('dropZone').style.display = 'none';
});
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  document.getElementById('dropZone').style.display = 'none';
  const files = [];
  const items = e.dataTransfer.items;
  if (items) {
    for (let item of items) {
      const entry = item.webkitGetAsEntry();
      if (entry) await traverseEntry(entry, files);
    }
  }
  const loaded = await loader.handleFiles(files);
  for (let s of loaded) {
    if (!game.songs.find(x => x.name === s.name)) game.songs.push(s);
  }
  if (loaded.length > 0) {
    game.screen = 'songSelect';
    game.selectedSong = Math.max(0, game.songs.length - loaded.length);
  }
});

async function traverseEntry(entry, files, path = '') {
  if (entry.isFile) {
    await new Promise(resolve => {
      entry.file(file => {
        file.webkitRelativePath = path + file.name;
        files.push(file);
        resolve();
      });
    });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    const entries = await new Promise(resolve => reader.readEntries(resolve));
    for (let en of entries) await traverseEntry(en, files, path + entry.name + '/');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.target && e.target.id === 'searchBox') return; // 検索入力中はゲームキー無効
  if (game.screen === 'playing' && game._endTriggered && (e.key === 'Enter' || e.key === 'Escape')) {
    game.screen = 'result';
    return;
  }
  game.handleKey(e);
});
canvas.addEventListener('mousedown', (e) => {
  if (game.screen === 'playing') {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    game.input(x < W / 2, x < W / 2 ? 'left' : 'right');
  } else {
    game.handleClick(e.clientX, e.clientY);
  }
});
canvas.addEventListener('mousemove', (e) => {
  if (game.screen === 'title') {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    game.titleHover = -1;
    for (let i = 0; i < 3; i++) {
      const cy = 520 + i * 40;
      if (x > W/2 - 170 && x < W/2 + 170 && y > cy - 26 && y < cy + 8) game.titleHover = i;
    }
  }
});
canvas.addEventListener('wheel', (e) => {
  if (game.screen === 'difficulty') {
    e.preventDefault();
    game.diffScrollX += e.deltaY * 0.5;
    const song = game.songs[game.selectedSong];
    if (song) {
      const totalWidth = song.courses.length * 190 - 20;
      game.diffScrollX = Math.max(0, Math.min(game.diffScrollX, Math.max(0, totalWidth - W + 100)));
    }
  } else if (game.screen === 'songSelect') {
    e.preventDefault();
    game.scrollOffset += e.deltaY * 0.5;
    game.buildSongListLayout();
    game.scrollOffset = Math.max(0, Math.min(game.scrollOffset, Math.max(0, game._listTotalH - 440)));
  }
}, { passive: false });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  for (let touch of e.changedTouches) {
    const x = (touch.clientX - rect.left) * (W / rect.width);
    if (game.screen === 'playing') game.input(x < W / 2, x < W / 2 ? 'left' : 'right');
    else game.handleClick(touch.clientX, touch.clientY);
  }
}, { passive: false });
</script>
